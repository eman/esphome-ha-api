name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The path grammar lives in Python and is tested there, so this job needs
      # esphome for config_validation.
      - run: pip install esphome
      - run: make -C tests test

  compile:
    name: ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each config names its own board. Xtensa and RISC-V both get built:
        # they disagree about integer types often enough to matter.
        config: [examples/basic.yaml, tests/ci/esp32p4.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Build against this checkout rather than the published component
        run: |
          mkdir -p ci && cp "${{ matrix.config }}" ci/device.yaml
          # Throwaway credentials so `esphome compile` has something to
          # validate. The API key is generated per run rather than hardcoded:
          # a literal here would look exactly like a real key to anyone reading
          # the file, and anyone who copied it would be giving a real device a
          # publicly known one.
          cat > ci/secrets.yaml <<EOF
          wifi_ssid: ci
          wifi_password: ci-password
          api_encryption_key: "$(openssl rand -base64 32)"
          EOF
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("ci/device.yaml")
          p.write_text(re.sub(
              r"source: github://eman/esphome-ha-api",
              "source:\n      type: local\n      path: ../components",
              p.read_text()))
          PY
      - run: esphome compile ci/device.yaml
