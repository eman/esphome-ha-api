<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a24"/><stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="410" fill="url(#bg)"/>

  <text x="56" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="600"
        fill="#FFFFFF" letter-spacing="-0.5">Home Assistant API for ESPHome</text>
  <text x="56" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#9AA4B2">
    More from the connection your device already has
  </text>

  <rect x="56" y="196" width="236" height="152" rx="14" fill="#191C21" stroke="#2C313A"/>
  <text x="174" y="278" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="600" fill="#C9D1DB">Home Assistant</text>

  <rect x="988" y="196" width="236" height="152" rx="14" fill="#191C21" stroke="#2C313A"/>
  <text x="1106" y="278" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="600" fill="#C9D1DB">ESPHome device</text>

  <!-- What already worked, and the two things these components add to it. -->
  <line x1="316" y1="232" x2="952" y2="232" stroke="#6E7889" stroke-width="1.5" stroke-opacity="0.55"/>
  <path d="M964,232 L951,225 L951,239 Z" fill="#6E7889" fill-opacity="0.7"/>
  <text x="316" y="221" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15"
        fill="#6E7889">live states</text>
  <text x="952" y="221" text-anchor="end" font-family="Menlo, DejaVu Sans Mono, monospace"
        font-size="12" fill="#6E7889">built in</text>

  <line x1="316" y1="272" x2="952" y2="272" stroke="#4E9FE0" stroke-width="1.75"/>
  <path d="M964,272 L951,265 L951,279 Z" fill="#4E9FE0"/>
  <text x="316" y="261" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15"
        fill="#4E9FE0">recorder history, at boot</text>
  <text x="952" y="261" text-anchor="end" font-family="Menlo, DejaVu Sans Mono, monospace"
        font-size="12" fill="#4E9FE0" fill-opacity="0.75">ha_history</text>

  <line x1="316" y1="312" x2="952" y2="312" stroke="#F2C230" stroke-width="1.75"/>
  <path d="M964,312 L951,305 L951,319 Z" fill="#F2C230"/>
  <text x="316" y="301" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15"
        fill="#F2C230">action responses, on a schedule</text>
  <text x="952" y="301" text-anchor="end" font-family="Menlo, DejaVu Sans Mono, monospace"
        font-size="12" fill="#F2C230" fill-opacity="0.75">ha_action</text>

  <text x="640" y="382" text-anchor="middle" font-family="Menlo, DejaVu Sans Mono, monospace"
        font-size="12" fill="#6E7889" letter-spacing="1.8">NO TOKEN · NO HTTP CLIENT</text>
</svg>
